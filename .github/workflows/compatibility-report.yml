name: compatibility-report
run-name: Validate archived compatibility ${{ inputs.measurement_run }}

on:
  workflow_call:
    inputs:
      measurement_run:
        description: Completed compatibility Actions run to validate
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MEASUREMENT_RUN: ${{ inputs.measurement_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check reporting tools
        run: |
          python3 -B -m unittest discover -s .github/scripts -p '*_test.py'
          node --test docs/scripts/ci-measurements.test.mjs docs/scripts/compatibility-results.test.mjs
      - name: Locate immutable legacy inputs
        run: |
          python3 -B .github/scripts/compatibility_artifact.py download-legacy .tmp/compatibility-corpora
      - name: Download source measurement evidence
        run: |
          gh run download "$MEASUREMENT_RUN" --name full-corpus-compatibility --dir .tmp/source-measurements
          gh run download "$MEASUREMENT_RUN" --pattern 'golang-*' --dir .tmp/compatibility-shards
          gh run download "$MEASUREMENT_RUN" --pattern 'graph-shard-*' --dir .tmp/graph-shards
      - name: Validate original pins, SDK identity and compiler evidence
        id: validated
        run: |
          python3 -B .github/scripts/compatibility_revalidate.py --source-run "$MEASUREMENT_RUN" \
            --reports .tmp/source-measurements/compatibility-ci --shards .tmp/compatibility-shards \
            --corpus-root .tmp/compatibility-corpora --graphs .tmp/graph-shards --output .tmp/validated-measurements
      - name: Export validated public measurements
        env:
          SOURCE_COMMIT: ${{ steps.validated.outputs.source-commit }}
          SOURCE_RUN_URL: ${{ steps.validated.outputs.source-run-url }}
          VALIDATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATION_COMMIT: ${{ github.sha }}
        run: |
          node docs/scripts/ci-measurements.mjs export --input .tmp/validated-measurements \
            --output .tmp/compatibility-public --run-url "$SOURCE_RUN_URL" --source-commit "$SOURCE_COMMIT" \
            --runner ubuntu-24.04 --validation-run-url "$VALIDATION_RUN_URL" --validation-source-commit "$VALIDATION_COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-compatibility-measurements
          path: .tmp/compatibility-public/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-compatibility-reports
          path: .tmp/validated-measurements/
          retention-days: 30
