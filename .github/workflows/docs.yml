name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "scripts/lib/**"
      - "scripts/install/**"
      - "test/compatibility/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/npm-smoke.yml"
      - "scripts/release/**"
      - ".node-version"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "scripts/lib/**"
      - "scripts/install/**"
      - "test/compatibility/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/npm-smoke.yml"
      - "scripts/release/**"
      - ".node-version"
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing stable release to deploy, including all versioned installers. Empty builds only.
        required: false
        type: string
  workflow_call:
    inputs:
      release-ref:
        required: true
        type: string
      release-commit:
        required: true
        type: string
      release-version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openapi-sdkgen-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer-releases:
    name: Discover published installer versions
    if: inputs.release-ref != '' || inputs.release-tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.inventory.outputs.tags }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: release
        uses: releaseway/actions/prepare@2abdf26c6f01c1e49da4ba5d85253847fe721fd9 # v0.6.3
        with:
          mode: resolve
          tag: ${{ inputs.release-ref || inputs.release-tag }}
          commit: ${{ inputs.release-commit }}
      - id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | select(any(.assets[]; .name == "install.sh" or .name == "install.ps1")) | .tag_name' \
            | jq -Rsc 'split("\n") | map(select(length > 0)) | unique')
          jq -e --arg tag "$RELEASE_TAG" 'index($tag) != null' <<< "$tags" > /dev/null
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  version-installers:
    name: Preserve installers for ${{ matrix.tag }}
    needs: installer-releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.installer-releases.outputs.tags) }}
    steps:
      - id: distribution
        uses: releaseway/actions/distribute@2abdf26c6f01c1e49da4ba5d85253847fe721fd9 # v0.6.3
        with:
          tag: ${{ matrix.tag }}
          files: |
            install.sh
            install.ps1
          destination: ${{ matrix.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-installers-${{ matrix.tag }}-${{ github.run_id }}
          path: ${{ steps.distribution.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build:
    name: Build documentation
    needs: [installer-releases, version-installers]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.installer-releases.outputs.commit || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release identity
        if: needs.installer-releases.outputs.tag != ''
        env:
          RELEASE_REF: ${{ needs.installer-releases.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.installer-releases.outputs.commit }}
          RELEASE_VERSION: ${{ needs.installer-releases.outputs.version }}
          EXPECTED_VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "v$RELEASE_VERSION"
          test -z "$EXPECTED_VERSION" || test "$EXPECTED_VERSION" = "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "$RELEASE_REF^{commit}")" = "$RELEASE_COMMIT"
      - name: Install existing TypeScript verification tooling
        run: bash scripts/dev/typescript.sh install
      - name: Install documentation dependencies
        env:
          CI: "true"
        run: bash docs/scripts/commands.sh install
      - name: Build documentation
        run: bash docs/scripts/commands.sh build
      - name: Verify built routes and generated consumers
        run: bash docs/scripts/commands.sh verify
      - name: Record documentation release identity
        if: needs.installer-releases.outputs.tag != ''
        env:
          RELEASE_REF: ${{ needs.installer-releases.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.installer-releases.outputs.commit }}
          RELEASE_VERSION: ${{ needs.installer-releases.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("docs/.vitepress/dist/release.json").write_text(json.dumps({
              "tag": os.environ["RELEASE_REF"], "commit": os.environ["RELEASE_COMMIT"],
              "version": os.environ["RELEASE_VERSION"], "targets": ["typescript", "golang"]
          }) + "\n")
          PY
      - name: Merge installers from the exact public release
        id: latest-installers
        if: needs.installer-releases.outputs.tag != ''
        uses: releaseway/actions/distribute@2abdf26c6f01c1e49da4ba5d85253847fe721fd9 # v0.6.3
        with:
          tag: ${{ needs.installer-releases.outputs.tag }}
          commit: ${{ needs.installer-releases.outputs.commit }}
          files: |
            install.sh
            install.ps1
          site: docs/.vitepress/dist
      - name: Restore every published installer version
        if: needs.installer-releases.outputs.tag != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: version-installers-*-${{ github.run_id }}
          path: ${{ runner.temp }}/version-installers
          merge-multiple: true
          digest-mismatch: error
      - name: Require every selected version before deployment
        if: needs.installer-releases.outputs.tag != ''
        env:
          INSTALLER_ROOT: ${{ runner.temp }}/version-installers
          INSTALLER_TAGS: ${{ needs.installer-releases.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -f "$INSTALLER_ROOT/$tag/install.sh"
            test -f "$INSTALLER_ROOT/$tag/install.ps1"
          done < <(jq -r '.[]' <<< "$INSTALLER_TAGS")
      - name: Merge versioned installers into the site
        id: distribution
        if: needs.installer-releases.outputs.tag != ''
        uses: releaseway/actions/distribute@2abdf26c6f01c1e49da4ba5d85253847fe721fd9 # v0.6.3
        with:
          root: ${{ runner.temp }}/version-installers
          files: |
            */install.sh
            */install.ps1
          site: ${{ steps.latest-installers.outputs.path }}
      - name: Upload complete site for Releaseway
        id: upload
        if: needs.installer-releases.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-distribution-${{ github.run_id }}
          path: ${{ steps.distribution.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  deploy:
    name: Deploy documentation
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.installer-releases.outputs.tag != '' && !contains(needs.installer-releases.outputs.tag, '-') }}
    needs: [build, installer-releases]
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    uses: releaseway/actions/.github/workflows/distribute-pages.yml@2abdf26c6f01c1e49da4ba5d85253847fe721fd9 # v0.6.3
    with:
      artifact-id: ${{ needs.build.outputs.artifact-id }}
      files: '**'
