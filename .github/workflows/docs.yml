name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "scripts/lib/**"
      - "test/compatibility/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/npm-smoke.yml"
      - "scripts/release/**"
      - ".node-version"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "scripts/lib/**"
      - "test/compatibility/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/npm-smoke.yml"
      - "scripts/release/**"
      - ".node-version"
  workflow_dispatch:
  workflow_call:
    inputs:
      release-ref:
        required: true
        type: string
      release-commit:
        required: true
        type: string
      release-version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openapi-sdkgen-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    outputs:
      shell-installer-sha: ${{ steps.installer-hashes.outputs.shell }}
      powershell-installer-sha: ${{ steps.installer-hashes.outputs.powershell }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release-commit || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release identity
        if: inputs.release-ref != ''
        env:
          RELEASE_REF: ${{ inputs.release-ref }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "$RELEASE_REF^{commit}")" = "$RELEASE_COMMIT"
      - name: Install existing TypeScript verification tooling
        run: bash scripts/dev/typescript.sh install
      - name: Install documentation dependencies
        env:
          CI: "true"
        run: bash docs/scripts/commands.sh install
      - name: Configure GitHub Pages
        if: inputs.release-ref != ''
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build documentation
        run: bash docs/scripts/commands.sh build
      - name: Verify built routes and generated consumers
        run: bash docs/scripts/commands.sh verify
      - name: Record documentation release identity
        if: inputs.release-ref != ''
        env:
          RELEASE_REF: ${{ inputs.release-ref }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("docs/.vitepress/dist/release.json").write_text(json.dumps({
              "tag": os.environ["RELEASE_REF"], "commit": os.environ["RELEASE_COMMIT"],
              "version": os.environ["RELEASE_VERSION"], "targets": ["typescript", "golang"]
          }) + "\n")
          PY
      - name: Merge installers from the exact public release
        id: distribution
        if: inputs.release-ref != ''
        uses: releaseway/actions/distribute@7427110b565bedef79ab0f80e6821a706d7f21ed # v0.5.1
        with:
          tag: ${{ inputs.release-ref }}
          commit: ${{ inputs.release-commit }}
          files: |
            install.sh
            install.ps1
          site: docs/.vitepress/dist
      - name: Record expected installer hashes
        id: installer-hashes
        if: inputs.release-ref != ''
        env:
          DISTRIBUTION_PATH: ${{ steps.distribution.outputs.path }}
        run: |
          set -euo pipefail
          echo "shell=$(sha256sum "$DISTRIBUTION_PATH/install.sh" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "powershell=$(sha256sum "$DISTRIBUTION_PATH/install.ps1" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        if: inputs.release-ref != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.distribution.outputs.path }}

  deploy:
    name: Deploy documentation
    timeout-minutes: 10
    if: inputs.release-ref != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-commit }}
          sparse-checkout: |
            scripts/install
            scripts/lib
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify installers at the deployed URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SHELL_SHA: ${{ needs.build.outputs.shell-installer-sha }}
          POWERSHELL_SHA: ${{ needs.build.outputs.powershell-installer-sha }}
        run: bash scripts/install/verify-site.sh
