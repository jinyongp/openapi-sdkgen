name: Release
run-name: >-
  ${{ inputs.tag != '' && format('Resume release {0}', inputs.tag)
      || github.ref_type == 'tag' && format('Publish release {0}', github.ref_name)
      || format('{0} {1} release from {2}', inputs.mode == 'release' && 'Publish' || 'Plan', inputs.prerelease-id || 'stable', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: Plan the next release or prepare and publish it.
        type: choice
        options: [plan, release]
        default: plan
      prerelease-id:
        description: Optional prerelease channel, such as rc or beta.
        required: false
        type: string
      tag:
        description: Existing release tag; dispatch with the same tag as the workflow ref.
        required: false
        type: string

concurrency:
  group: openapi-sdkgen-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Plan or verify release
    runs-on: ubuntu-24.04
    # Source CI can take 30 minutes; leave time for release build checks.
    timeout-minutes: 45
    if: (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && (!inputs.tag || github.ref == format('refs/tags/{0}', inputs.tag))
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.existing.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.existing.outputs.version }}
      commit: ${{ steps.release.outputs.commit || steps.existing.outputs.commit }}
      plan-artifact-id: ${{ steps.plan-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: existing
        if: github.ref_type == 'tag'
        uses: releaseway/actions/prepare@b6f17f2ffe2c8fd92bdf6be4729e1e56d151bef3 # v0.8.0
        with:
          mode: resolve
          allow-prerelease: "true"
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
      - name: Reuse successful CI for the release source
        if: github.event_name == 'push' || inputs.mode == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/release_ci.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'push' || inputs.mode == 'release' || inputs.tag != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'push' || inputs.mode == 'release' || inputs.tag != ''
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check release builds and examples
        if: github.event_name == 'push' || inputs.mode == 'release' || inputs.tag != ''
        run: bash scripts/release/check.sh
      - id: release
        if: github.ref_type != 'tag'
        uses: releaseway/actions/prepare@b6f17f2ffe2c8fd92bdf6be4729e1e56d151bef3 # v0.8.0
        with:
          mode: plan
          prerelease-id: ${{ inputs.prerelease-id }}
          plan-path: ${{ runner.temp }}/release-plan.json
      - name: Preserve release plan
        id: plan-artifact
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release.outputs.plan-path }}
          if-no-files-found: error
          retention-days: 7
      - name: Preserve preparation diagnostics
        if: always() && (steps.release.outputs.diagnostics-path != '' || steps.existing.outputs.diagnostics-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preparation-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ steps.release.outputs.diagnostics-path }}
            ${{ steps.existing.outputs.diagnostics-path }}
          if-no-files-found: error
          retention-days: 7
      - name: Preserve check diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-check-diagnostics
          path: .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  tag-release:
    name: Tag verified source and request publication
    needs: prepare-release
    if: github.ref == 'refs/heads/main' && inputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Restore verified release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.plan-artifact-id }}
          path: ${{ runner.temp }}/release-plan
          digest-mismatch: error
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0
      - name: Tag the verified source without changing main
        id: release
        uses: releaseway/actions/prepare@b6f17f2ffe2c8fd92bdf6be4729e1e56d151bef3 # v0.8.0
        with:
          mode: resume
          plan-path: ${{ runner.temp }}/release-plan/release-plan.json
      - name: Preserve tag diagnostics
        if: always() && steps.release.outputs.diagnostics-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tag-diagnostics-${{ github.run_attempt }}
          path: ${{ steps.release.outputs.diagnostics-path }}
          if-no-files-found: error
          retention-days: 7
      # GITHUB_TOKEN tag pushes do not trigger push workflows. Dispatch at the
      # tag so npm provenance and every distribution use the same release ref.
      - name: Request publication at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$RELEASE_TAG" -f "tag=$RELEASE_TAG"
          printf 'Tagged %s and requested publication. Follow its separate Release run; use --resume %s to retry.\n' "$RELEASE_TAG" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    name: Publish npm package
    needs: [prepare-release, publish-github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish npm package through Releaseway
        id: npm
        uses: releaseway/npm-actions@a663ac41be77d1345fd9f4023f11a02e341c62f9 # v0.7.5
        with:
          release-tag: ${{ needs.prepare-release.outputs.tag }}
      - name: Preserve npm diagnostics
        if: always() && (steps.npm.outputs.report-path != '' || steps.npm.outputs.diagnostics-path != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ steps.npm.outputs.report-path }}
            ${{ steps.npm.outputs.diagnostics-path }}
          if-no-files-found: error
          retention-days: 7

  verify-npm-release:
    name: Verify npm distribution
    needs: [prepare-release, publish-npm]
    uses: ./.github/workflows/npm-smoke.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
      commit: ${{ needs.prepare-release.outputs.commit }}

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [prepare-release, publish-github-release]
    uses: releaseway/homebrew-actions/.github/workflows/publish.yml@7e351bd4f3ea1aa0070e4d6556bb5130df2401e6 # v0.5.3
    permissions:
      contents: read
    with:
      tap-repository: jinyongp/homebrew-tap
      commit: ${{ needs.prepare-release.outputs.commit }}
      version: ${{ needs.prepare-release.outputs.version }}
    secrets:
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  publish-github-release:
    name: Publish GitHub Release
    needs: prepare-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0
      - name: Reuse published immutable assets on retry
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | {draft, immutable}' > "$release_json"
          if [[ ! -s "$release_json" ]] || jq -e '.draft == true' "$release_json" >/dev/null; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '.immutable == true' "$release_json" >/dev/null; then
            echo 'Published release must be immutable before reusing its assets.' >&2
            exit 1
          fi
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern checksums.txt \
            --pattern install.sh --pattern install.ps1 \
            --pattern "openapi-sdkgen_${VERSION}_*.tar.gz" \
            --pattern "openapi-sdkgen_${VERSION}_*.zip"
          (cd dist && sha256sum --check --strict checksums.txt)
          for platform in darwin linux windows; do
            extension=tar.gz
            if [[ "$platform" == windows ]]; then extension=zip; fi
            for arch in amd64 arm64; do
              test -f "dist/openapi-sdkgen_${VERSION}_${platform}_${arch}.${extension}"
            done
          done
          echo 'build=false' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.assets.outputs.build == 'true'
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.assets.outputs.build == 'true'
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean --skip=publish --config .goreleaser.yaml
      - name: Prepare versioned installers and checksums
        if: steps.assets.outputs.build == 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          bash scripts/install/build.sh "$RELEASE_VERSION" dist
          (cd dist && sha256sum install.sh install.ps1 >> checksums.txt)
      - name: Publish immutable GitHub Release
        id: publication
        uses: releaseway/actions@b6f17f2ffe2c8fd92bdf6be4729e1e56d151bef3 # v0.8.0
        with:
          tag: ${{ needs.prepare-release.outputs.tag }}
          commit: ${{ needs.prepare-release.outputs.commit }}
          prerelease: ${{ contains(needs.prepare-release.outputs.tag, '-') && 'true' || 'false' }}
          latest: current-series
          notes: standard
          upload-concurrency: "4"
          assets: |
            dist/checksums.txt
            dist/install.sh
            dist/install.ps1
            dist/openapi-sdkgen_${{ needs.prepare-release.outputs.version }}_*.tar.gz
            dist/openapi-sdkgen_${{ needs.prepare-release.outputs.version }}_*.zip
      - name: Preserve GitHub Release diagnostics
        if: always() && steps.publication.outputs.diagnostics-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-diagnostics-${{ github.run_attempt }}
          path: ${{ steps.publication.outputs.diagnostics-path }}
          if-no-files-found: error
          retention-days: 7

  verify-native-release:
    name: Verify published native Go support
    needs: [prepare-release, publish-github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify the published installer and generate a Go consumer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-smoke"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/native-smoke" --pattern checksums.txt --pattern install.sh
          cd "$RUNNER_TEMP/native-smoke"
          sha256sum --check --ignore-missing checksums.txt
          sh install.sh --install-dir "$RUNNER_TEMP/native-smoke/bin"
          cd "$GITHUB_WORKSPACE"
          bash scripts/release/smoke-go.sh native "$RUNNER_TEMP/native-smoke/bin/openapi-sdkgen" "$RELEASE_VERSION"

  verify-installers:
    name: Verify published installer on ${{ matrix.os }}
    needs: [prepare-release, publish-github-release]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Install and execute on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$RELEASE_TAG" --pattern install.sh --pattern checksums.txt
          grep '  install\.sh$' checksums.txt | shasum -a 256 --check --strict
          sh install.sh --install-dir "$RUNNER_TEMP/sdkgen-bin"
          test "$("$RUNNER_TEMP/sdkgen-bin/openapi-sdkgen" --version)" = "openapi-sdkgen $RELEASE_VERSION"
      - name: Install and execute on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:RUNNER_TEMP
          gh release download $env:RELEASE_TAG --pattern install.ps1 --pattern checksums.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $entries = @(Get-Content checksums.txt | Where-Object { $_ -cmatch '^[0-9a-fA-F]{64}  install\.ps1$' })
          if ($entries.Count -ne 1 -or (Get-FileHash install.ps1 -Algorithm SHA256).Hash -ine ($entries[0] -split '\s+')[0]) { throw 'Installer checksum mismatch' }
          & ./install.ps1 -InstallDir "$env:RUNNER_TEMP/sdkgen-bin"
          $version = & "$env:RUNNER_TEMP/sdkgen-bin/openapi-sdkgen.exe" --version
          if ($LASTEXITCODE -ne 0 -or $version -cne "openapi-sdkgen $env:RELEASE_VERSION") { throw 'Installed version mismatch' }

  verify-homebrew-release:
    name: Verify Homebrew Go support
    needs: [prepare-release, publish-homebrew]
    if: needs.prepare-release.outputs.tag != '' && !contains(needs.prepare-release.outputs.tag, '-')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install and verify the published Homebrew formula
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          brew update
          brew install bash
          export PATH="$(brew --prefix bash)/bin:$PATH"
          brew install jinyongp/tap/openapi-sdkgen
          bash scripts/release/smoke-go.sh native "$(command -v openapi-sdkgen)" "$RELEASE_VERSION"

  publish-documentation:
    name: Publish matching documentation
    needs: [prepare-release, verify-native-release, verify-installers, verify-npm-release, verify-homebrew-release]
    if: needs.prepare-release.outputs.tag != '' && !contains(needs.prepare-release.outputs.tag, '-')
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    with:
      release-ref: ${{ needs.prepare-release.outputs.tag }}
      release-commit: ${{ needs.prepare-release.outputs.commit }}
      release-version: ${{ needs.prepare-release.outputs.version }}
