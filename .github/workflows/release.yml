name: release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated SemVer tag to resume.
        required: true
        type: string

concurrency:
  group: openapi-sdkgen-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "release tag must be SemVer: $TAG" >&2
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            IFS=. read -r -a prerelease_identifiers <<<"${TAG#*-}"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "release tag has an invalid numeric prerelease identifier: $TAG" >&2
                exit 1
              fi
            done
          fi
          git fetch --force origin main "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "release tag must be annotated: $TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "release tag must point to a commit merged into main: $TAG" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "ref=refs/tags/$TAG"
            echo "version=${TAG#v}"
            echo "commit=$(git rev-parse "${TAG}^{commit}")"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish npm package
    needs: [validate-release, publish-github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: release-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify immutable tag target
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate-release.outputs.commit }}"
      - name: Build npm package
        run: |
          SOURCE_ROOT="$GITHUB_WORKSPACE" \
            NPM_PACKAGE_DIR="$GITHUB_WORKSPACE/.tmp/npm-package" \
            bash release-tools/scripts/npm/package.sh "${{ needs.validate-release.outputs.version }}"
      - name: Publish npm package through OIDC
        run: bash release-tools/scripts/npm/publish.sh "$GITHUB_WORKSPACE/.tmp/npm-package" ${{ contains(needs.validate-release.outputs.tag, '-') && 'next' || 'latest' }}

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [validate-release, publish-github-release]
    uses: releaseway/homebrew-actions/.github/workflows/publish.yml@c035d14050bca1e2028a6368823797d36c9cdbc5 # v0.1.0
    permissions:
      contents: read
    with:
      tap-repository: jinyongp/homebrew-tap
      commit: ${{ needs.validate-release.outputs.commit }}
      version: ${{ needs.validate-release.outputs.version }}
    secrets:
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  publish-github-release:
    name: Publish GitHub Release
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.ref }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: release-tools
      - name: Verify immutable tag target
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate-release.outputs.commit }}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Prepare GoReleaser config
        run: |
          cp release-tools/.goreleaser.yaml "$RUNNER_TEMP/goreleaser.yaml"
          rm -rf release-tools
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: release --clean --skip=publish --config ${{ runner.temp }}/goreleaser.yaml
      - name: Publish immutable GitHub Release
        uses: releaseway/actions@49c543357d96884d0e5a683c45d45ebd50a8b612 # v0.1.4
        with:
          tag: ${{ needs.validate-release.outputs.tag }}
          commit: ${{ needs.validate-release.outputs.commit }}
          prerelease: ${{ contains(needs.validate-release.outputs.tag, '-') && 'true' || 'false' }}
          generate-notes: "true"
          assets: |
            dist/checksums.txt
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_darwin_amd64.tar.gz
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_darwin_arm64.tar.gz
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_linux_amd64.tar.gz
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_linux_arm64.tar.gz
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_windows_amd64.zip
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_windows_arm64.zip
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_darwin_amd64
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_darwin_arm64
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_linux_amd64
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_linux_arm64
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_windows_amd64.exe
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_windows_arm64.exe
