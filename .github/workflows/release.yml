name: release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated SemVer tag to resume.
        required: true
        type: string

concurrency:
  group: openapi-sdkgen-release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "release tag must be SemVer: $TAG" >&2
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            IFS=. read -r -a prerelease_identifiers <<<"${TAG#*-}"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "release tag has an invalid numeric prerelease identifier: $TAG" >&2
                exit 1
              fi
            done
          fi
          git fetch --force origin main "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "release tag must be annotated: $TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "release tag must point to a commit merged into main: $TAG" >&2
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "ref=refs/tags/$TAG"
            echo "version=${TAG#v}"
            echo "commit=$(git rev-parse "${TAG}^{commit}")"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish npm package
    needs: [validate-release, publish-github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.ref }}
          fetch-depth: 0
      - name: Verify immutable tag target
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate-release.outputs.commit }}"
      - name: Publish npm package through Releaseway
        id: npm
        uses: releaseway/npm-actions@269fbdeac83fed2df2880915726ed91edbe1bbdd # v0.4.0

  verify-npm-release:
    name: Verify npm distribution
    needs: [validate-release, publish-npm]
    uses: ./.github/workflows/npm-smoke.yml
    with:
      version: ${{ needs.validate-release.outputs.version }}

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [validate-release, publish-github-release]
    uses: releaseway/homebrew-actions/.github/workflows/publish.yml@4bbfa6aafc92a6cb8e823a51d54a6573237e0a76 # v0.2.0
    permissions:
      contents: read
    with:
      tap-repository: jinyongp/homebrew-tap
      commit: ${{ needs.validate-release.outputs.commit }}
      version: ${{ needs.validate-release.outputs.version }}
    secrets:
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  publish-github-release:
    name: Publish GitHub Release
    needs: validate-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.ref }}
          fetch-depth: 0
      - name: Verify immutable tag target
        run: test "$(git rev-parse HEAD)" = "${{ needs.validate-release.outputs.commit }}"
      - name: Reuse published immutable assets on retry
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | {draft, immutable}' > "$release_json"
          if [[ ! -s "$release_json" ]] || jq -e '.draft == true' "$release_json" >/dev/null; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '.immutable == true' "$release_json" >/dev/null; then
            echo 'Published release must be immutable before reusing its assets.' >&2
            exit 1
          fi
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern checksums.txt \
            --pattern "openapi-sdkgen_${VERSION}_*.tar.gz" \
            --pattern "openapi-sdkgen_${VERSION}_*.zip"
          (cd dist && sha256sum --check --strict checksums.txt)
          for platform in darwin linux windows; do
            extension=tar.gz
            if [[ "$platform" == windows ]]; then extension=zip; fi
            for arch in amd64 arm64; do
              test -f "dist/openapi-sdkgen_${VERSION}_${platform}_${arch}.${extension}"
            done
          done
          echo 'build=false' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.assets.outputs.build == 'true'
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.assets.outputs.build == 'true'
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: release --clean --skip=publish --config .goreleaser.yaml
      - name: Publish immutable GitHub Release
        uses: releaseway/actions@c054f2de3448e79e5d854155e701e13ad31a520c # v0.3.1
        with:
          tag: ${{ needs.validate-release.outputs.tag }}
          commit: ${{ needs.validate-release.outputs.commit }}
          prerelease: ${{ contains(needs.validate-release.outputs.tag, '-') && 'true' || 'false' }}
          notes: standard
          upload-concurrency: "4"
          assets: |
            dist/checksums.txt
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_*.tar.gz
            dist/openapi-sdkgen_${{ needs.validate-release.outputs.version }}_*.zip
