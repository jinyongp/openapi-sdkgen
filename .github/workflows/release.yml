name: release
run-name: Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.mode }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: Plan the next release or prepare and publish it.
        type: choice
        options: [plan, release]
        default: plan
      prerelease-id:
        description: Optional prerelease channel, such as rc or beta.
        required: false
        type: string
      tag:
        description: Existing release tag; dispatch with the same tag as the workflow ref.
        required: false
        type: string

concurrency:
  group: openapi-sdkgen-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Check and prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && (!inputs.tag || github.ref == format('refs/tags/{0}', inputs.tag))
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.existing.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.existing.outputs.version }}
      commit: ${{ steps.release.outputs.commit || steps.existing.outputs.commit }}
      release-commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check product before changing release refs
        run: bash scripts/release/check.sh
      - id: existing
        if: github.ref_type == 'tag'
        uses: releaseway/actions/prepare@5841e545ff259790a3b2461299e741d62c69a73d # v0.4.1
        with:
          mode: ${{ contains(github.ref_name, '-') && 'tag' || 'resolve' }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
      - id: release
        if: github.ref_type != 'tag'
        uses: releaseway/actions/prepare@5841e545ff259790a3b2461299e741d62c69a73d # v0.4.1
        with:
          mode: ${{ inputs.mode == 'release' && 'prepare' || 'plan' }}
          prerelease-id: ${{ inputs.prerelease-id }}
      - name: Preserve release plan
        if: always() && steps.release.outputs.plan-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: ${{ steps.release.outputs.plan-path }}
          retention-days: 7
      - name: Preserve check diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-check-diagnostics
          path: .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  publish-npm:
    name: Publish npm package
    needs: [prepare-release, publish-github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish npm package through Releaseway
        id: npm
        uses: releaseway/npm-actions@680948414bbe6bfe64e94f776c3514ad44f3dd69 # v0.5.1
        with:
          release-commit: ${{ needs.prepare-release.outputs.release-commit }}

  verify-npm-release:
    name: Verify npm distribution
    needs: [prepare-release, publish-npm]
    uses: ./.github/workflows/npm-smoke.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}

  publish-homebrew:
    name: Publish Homebrew formula
    needs: [prepare-release, publish-github-release]
    uses: releaseway/homebrew-actions/.github/workflows/publish.yml@5e6570fec2e5d16ad61868877da3a175fac99479 # v0.3.5
    permissions:
      contents: read
    with:
      tap-repository: jinyongp/homebrew-tap
      commit: ${{ needs.prepare-release.outputs.commit }}
      version: ${{ needs.prepare-release.outputs.version }}
    secrets:
      tap_deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  publish-github-release:
    name: Publish GitHub Release
    needs: prepare-release
    if: github.event_name == 'push' || inputs.mode == 'release' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0
      - name: Reuse published immutable assets on retry
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | {draft, immutable}' > "$release_json"
          if [[ ! -s "$release_json" ]] || jq -e '.draft == true' "$release_json" >/dev/null; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '.immutable == true' "$release_json" >/dev/null; then
            echo 'Published release must be immutable before reusing its assets.' >&2
            exit 1
          fi
          mkdir -p dist
          gh release download "$TAG" --dir dist \
            --pattern checksums.txt \
            --pattern "openapi-sdkgen_${VERSION}_*.tar.gz" \
            --pattern "openapi-sdkgen_${VERSION}_*.zip"
          (cd dist && sha256sum --check --strict checksums.txt)
          for platform in darwin linux windows; do
            extension=tar.gz
            if [[ "$platform" == windows ]]; then extension=zip; fi
            for arch in amd64 arm64; do
              test -f "dist/openapi-sdkgen_${VERSION}_${platform}_${arch}.${extension}"
            done
          done
          echo 'build=false' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.assets.outputs.build == 'true'
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.assets.outputs.build == 'true'
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: release --clean --skip=publish --config .goreleaser.yaml
      - name: Publish immutable GitHub Release
        uses: releaseway/actions@5841e545ff259790a3b2461299e741d62c69a73d # v0.4.1
        with:
          tag: ${{ needs.prepare-release.outputs.tag }}
          commit: ${{ needs.prepare-release.outputs.commit }}
          prerelease: ${{ contains(needs.prepare-release.outputs.tag, '-') && 'true' || 'false' }}
          latest: current-series
          notes: standard
          upload-concurrency: "4"
          assets: |
            dist/checksums.txt
            dist/openapi-sdkgen_${{ needs.prepare-release.outputs.version }}_*.tar.gz
            dist/openapi-sdkgen_${{ needs.prepare-release.outputs.version }}_*.zip
