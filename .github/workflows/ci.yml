name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-sdkgen-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installers:
    uses: ./.github/workflows/installers.yml

  suites:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    # Go compiles generated consumers within a 20-minute package budget.
    # Leave room for toolchain setup, source checks and diagnostics.
    timeout-minutes: ${{ matrix.suite == 'go' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [go, typescript-runtime, typescript-tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Go tests execute generated SDKs, so this suite also needs Node/TypeScript.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install TypeScript dependencies
        run: bash scripts/dev/typescript.sh install
      - name: Run independent suite
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/dev/ci.sh "$SUITE"
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.suite }}
          path: .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  compilers:
    name: TypeScript ${{ matrix.version }} consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ["5.7.3", "5.9.3", "6.0.3", "7.0.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install TypeScript dependencies
        run: bash scripts/dev/typescript.sh install
      - name: Check representative consumers
        env:
          COMPILER_VERSION: ${{ matrix.version }}
        run: bash scripts/dev/ci.sh compiler "$COMPILER_VERSION"
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-typescript-${{ matrix.version }}
          path: .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  validate:
    name: Validate source
    needs: [suites, compilers, installers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all suites to pass
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
          COMPILERS_RESULT: ${{ needs.compilers.result }}
          INSTALLERS_RESULT: ${{ needs.installers.result }}
        run: |
          if [[ "$SUITES_RESULT" != success || "$COMPILERS_RESULT" != success || "$INSTALLERS_RESULT" != success ]]; then
            printf 'validation failed: suites=%s compilers=%s installers=%s\n' "$SUITES_RESULT" "$COMPILERS_RESULT" "$INSTALLERS_RESULT" >&2
            exit 1
          fi
