name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-sdkgen-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installers:
    uses: ./.github/workflows/installers.yml

  suites:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [go-core, typescript-generator, typescript-runtime, typescript-matrix, typescript-tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Go tests execute generated SDKs, so this suite also needs Node/TypeScript.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install TypeScript dependencies
        run: bash scripts/dev/typescript.sh install
      - name: Run independent suite
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/dev/ci.sh "$SUITE"
      - name: Preserve test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-timings-${{ matrix.suite }}
          path: .tmp/ci-tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.suite }}
          path: .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  go-consumers:
    name: Go consumers ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install TypeScript dependencies
        run: bash scripts/dev/typescript.sh install
      - name: Run generated Go consumer shard
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/dev/ci.sh go-consumers "$SHARD" 4
      - name: Preserve test inventory and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-consumer-timings-${{ matrix.shard }}
          path: .tmp/ci-tests/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-go-consumers-${{ matrix.shard }}
          path: .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  compilers:
    name: TypeScript ${{ matrix.version }} ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ["5.7.3", "5.9.3", "6.0.3", "7.0.2"]
        group: [consumers, declarations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install TypeScript dependencies
        run: bash scripts/dev/typescript.sh install
      - name: Check representative consumers
        env:
          COMPILER_VERSION: ${{ matrix.version }}
          COMPILER_GROUP: ${{ matrix.group }}
        run: bash scripts/dev/ci.sh compiler "$COMPILER_VERSION" "$COMPILER_GROUP"
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-typescript-${{ matrix.version }}-${{ matrix.group }}
          path: .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  validate:
    name: Validate source
    needs: [suites, go-consumers, compilers, installers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Go consumer inventories
        if: needs.go-consumers.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-consumer-timings-*
          merge-multiple: true
          path: .tmp/ci-tests/
      - name: Require complete disjoint Go consumer coverage
        if: needs.go-consumers.result == 'success'
        run: python3 -B scripts/dev/go_ci.py verify
      - name: Require all suites to pass
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
          GO_CONSUMERS_RESULT: ${{ needs.go-consumers.result }}
          COMPILERS_RESULT: ${{ needs.compilers.result }}
          INSTALLERS_RESULT: ${{ needs.installers.result }}
        run: |
          if [[ "$SUITES_RESULT" != success || "$GO_CONSUMERS_RESULT" != success || "$COMPILERS_RESULT" != success || "$INSTALLERS_RESULT" != success ]]; then
            printf 'validation failed: suites=%s go-consumers=%s compilers=%s installers=%s\n' "$SUITES_RESULT" "$GO_CONSUMERS_RESULT" "$COMPILERS_RESULT" "$INSTALLERS_RESULT" >&2
            exit 1
          fi
