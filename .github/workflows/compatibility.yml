name: compatibility
run-name: Corpus compatibility ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: openapi-sdkgen-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select all compatibility jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      documents: ${{ steps.matrix.outputs.documents }}
      corpora: ${{ steps.matrix.outputs.corpora }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate and select jobs
        id: matrix
        shell: bash
        run: |
          python3 -B -m unittest discover -s .github/scripts -p '*_test.py'
          python3 -B .github/scripts/compatibility_matrix.py

  prepare:
    name: Prepare ${{ matrix.corpus }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.corpora) }}
    env:
      COMPATIBILITY_CORPUS: ${{ matrix.corpus }}
      COMPATIBILITY_ARTIFACT: ${{ matrix.artifact }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Record preparation start
        run: echo "COMPATIBILITY_PREPARE_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Find reusable pinned corpus
        id: artifact
        run: python3 -B .github/scripts/compatibility_artifact.py find "$COMPATIBILITY_ARTIFACT"
      - name: Restore prior corpus artifact
        id: restore
        if: steps.artifact.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          run-id: ${{ steps.artifact.outputs.source-run }}
          github-token: ${{ github.token }}
          path: .tmp/compatibility-restore
      - name: Verify restored inputs before reuse
        id: verified
        if: steps.restore.outcome == 'success'
        run: python3 -B .github/scripts/compatibility_artifact.py restore "$COMPATIBILITY_CORPUS"
      - name: Fetch pinned corpus documents and references
        if: steps.verified.outputs.reused != 'true' && matrix.fetch
        shell: bash
        run: |
          bash scripts/compatibility/fetch.sh fresh "test/compatibility/$COMPATIBILITY_CORPUS.json" \
            ".tmp/compatibility-corpora/$COMPATIBILITY_CORPUS"
      - name: Prepare checked-in snapshots
        if: steps.verified.outputs.reused != 'true' && !matrix.fetch
        run: python3 -B .github/scripts/compatibility_artifact.py local "$COMPATIBILITY_CORPUS"
      - name: Verify the complete pinned corpus
        shell: bash
        run: |
          bash scripts/compatibility/fetch.sh offline "test/compatibility/$COMPATIBILITY_CORPUS.json" \
            ".tmp/compatibility-corpora/$COMPATIBILITY_CORPUS"
      - name: Save fresh corpus for this and later runs
        if: steps.verified.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: .tmp/compatibility-corpora/${{ matrix.corpus }}/
          include-hidden-files: true
          retention-days: 7
      - name: Summarize preparation
        env:
          COMPATIBILITY_REUSED: ${{ steps.verified.outputs.reused }}
        run: python3 -B .github/scripts/compatibility_artifact.py summary "$COMPATIBILITY_CORPUS"
      - name: Upload preparation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-preparation-${{ matrix.corpus }}
          path: .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  documents:
    name: Measure ${{ matrix.corpus }} / ${{ matrix.document }} / ${{ matrix.scope }}
    needs: [plan, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.documents) }}
    env:
      GOMEMLIMIT: 12GiB
      COMPATIBILITY_CORPUS: ${{ matrix.corpus }}
      COMPATIBILITY_DOCUMENT: ${{ matrix.document }}
      COMPATIBILITY_ARTIFACT: ${{ matrix.artifact }}
      COMPATIBILITY_SCOPE: ${{ matrix.scope }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Find the prepared corpus artifact
        id: artifact
        run: python3 -B .github/scripts/compatibility_artifact.py find "$COMPATIBILITY_ARTIFACT" --required
      - name: Download verified corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          run-id: ${{ steps.artifact.outputs.source-run }}
          github-token: ${{ github.token }}
          path: .tmp/compatibility-corpora/${{ matrix.corpus }}
      - name: Record runner resources
        shell: bash
        run: |
          mkdir -p .tmp/compatibility-ci
          { free -h; df -h .; } | tee .tmp/compatibility-ci/runner.txt
      - name: Install TypeScript dependencies
        if: matrix.typecheck
        run: bash scripts/dev/typescript.sh install
      - name: Generate SDKs and verify every generated module
        id: benchmark
        timeout-minutes: 90
        shell: bash
        run: |
          compatibility_selection=""
          if [[ "$COMPATIBILITY_SCOPE" == selected ]]; then
            compatibility_selection="test/compatibility/selections/$COMPATIBILITY_DOCUMENT.toml"
          fi
          /usr/bin/time -v -o .tmp/compatibility-ci/resources.txt \
            bash scripts/compatibility/benchmark.sh "test/compatibility/$COMPATIBILITY_CORPUS.json" \
            ".tmp/compatibility-corpora/$COMPATIBILITY_CORPUS" \
            .tmp/compatibility-ci/report.json 60m "$COMPATIBILITY_DOCUMENT" "$compatibility_selection" &
          compatibility_process=$!
          python3 -B -u .github/scripts/compatibility_observer.py \
            --root-pid "$compatibility_process" --typescript-root test/typescript \
            --output .tmp/compatibility-ci/progress.jsonl &
          compatibility_observer=$!
          trap 'kill "$compatibility_observer" 2>/dev/null || true; wait "$compatibility_observer" 2>/dev/null || true' EXIT
          wait "$compatibility_process"
      - name: Require a verified supported SDK profile
        if: always() && steps.benchmark.outcome != 'skipped' && matrix.typecheck
        shell: bash
        run: |
          python3 -B .github/scripts/compatibility_gate.py \
            --manifest "test/compatibility/$COMPATIBILITY_CORPUS.json" \
            --report .tmp/compatibility-ci/report.json --document "$COMPATIBILITY_DOCUMENT" \
            --resources-directory .tmp/compatibility-ci --selection-directory test/compatibility/selections
      - name: Require complete generation-only measurements
        if: always() && steps.benchmark.outcome != 'skipped' && !matrix.typecheck
        run: |
          python3 -B .github/scripts/compatibility_generation_gate.py \
            --manifest "test/compatibility/$COMPATIBILITY_CORPUS.json" \
            --report .tmp/compatibility-ci/report.json --scope "$COMPATIBILITY_SCOPE" \
            --resources-directory .tmp/compatibility-ci
      - name: Upload measurement and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.typecheck && format('document-shard-{0}-{1}', matrix.corpus, matrix.document) || format('graph-shard-{0}', matrix.scope) }}
          path: |
            .tmp/compatibility-ci/
            .tmp/runs/
          include-hidden-files: true
          retention-days: 7

  report:
    name: Combine all corpus results
    needs: [plan, prepare, documents]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download document measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: document-shard-*
          path: .tmp/compatibility-shards
      - name: Combine and verify every corpus
        shell: bash
        run: |
          compatibility_failed=0
          for corpus in holdout modern production32 regression; do
            if bash scripts/compatibility/merge.sh "test/compatibility/$corpus.json" \
              ".tmp/compatibility-ci/$corpus-results.json" \
              .tmp/compatibility-shards/document-shard-"$corpus"-*/compatibility-ci/report.json; then
              python3 -B .github/scripts/compatibility_gate.py \
                --manifest "test/compatibility/$corpus.json" \
                --report ".tmp/compatibility-ci/$corpus-results.json" \
                --resource-shards .tmp/compatibility-shards \
                --selection-directory test/compatibility/selections || compatibility_failed=1
            else
              compatibility_failed=1
            fi
          done
          exit "$compatibility_failed"
      - name: Download generation-only measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: graph-shard-*
          path: .tmp/graph-shards
      - name: Verify generation-only measurements
        run: |
          for scope in full selected; do
            python3 -B .github/scripts/compatibility_generation_gate.py \
              --manifest test/compatibility/regression.json \
              --report ".tmp/graph-shards/graph-shard-$scope/compatibility-ci/report.json" --scope "$scope"
            cp ".tmp/graph-shards/graph-shard-$scope/compatibility-ci/report.json" ".tmp/compatibility-ci/graph-$scope-results.json"
          done
      - name: Extract public measurement results
        env:
          MEASUREMENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MEASUREMENT_COMMIT: ${{ github.sha }}
        run: |
          node docs/scripts/ci-measurements.mjs export \
            --input .tmp/compatibility-ci --output .tmp/compatibility-public \
            --run-url "$MEASUREMENT_RUN_URL" --source-commit "$MEASUREMENT_COMMIT" \
            --runner ubuntu-24.04
      - name: Upload public measurement results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-compatibility-measurements
          path: .tmp/compatibility-public/
          retention-days: 30
      - name: Upload combined measurement and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-corpus-compatibility
          path: |
            .tmp/compatibility-ci/
            .tmp/runs/
          include-hidden-files: true
          retention-days: 7
