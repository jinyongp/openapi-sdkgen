name: compatibility
run-name: Full corpus compatibility ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-sdkgen-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare all pinned corpora
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      documents: ${{ steps.matrix.outputs.documents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - name: Validate and select all document jobs
        id: matrix
        shell: bash
        run: |
          python3 -B -m unittest discover -s .github/scripts -p '*_test.py'
          python3 -B .github/scripts/compatibility_matrix.py
      - name: Fetch pinned holdout documents
        run: just agent compatibility-fetch test/compatibility/holdout.json .tmp/compatibility-corpora/holdout
      - name: Fetch pinned regression documents
        run: just agent compatibility-fetch test/compatibility/regression.json .tmp/compatibility-corpora/regression
      - name: Prepare and verify checked-in snapshots
        shell: bash
        run: |
          python3 -B <<'PY'
          import json
          import shutil
          from pathlib import Path
          for name in ('modern', 'production32'):
              manifest = json.loads(Path(f'test/compatibility/{name}.json').read_text())
              destination = Path('.tmp/compatibility-corpora') / name
              for entry in manifest['corpora'] + manifest.get('files', []):
                  target = destination / entry['input']
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(Path('test') / entry['input'], target)
          PY
          just agent compatibility-verify test/compatibility/modern.json .tmp/compatibility-corpora/modern
          just agent compatibility-verify test/compatibility/production32.json .tmp/compatibility-corpora/production32
      - name: Share verified corpora
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinned-corpora
          path: .tmp/compatibility-corpora/
          include-hidden-files: true
          retention-days: 7
      - name: Upload fetch diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-fetch-diagnostics
          path: .tmp/agent-logs/
          include-hidden-files: true
          retention-days: 7

  documents:
    name: Verify ${{ matrix.corpus }} / ${{ matrix.document }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.documents) }}
    env:
      GOMEMLIMIT: 12GiB
      COMPATIBILITY_CORPUS: ${{ matrix.corpus }}
      COMPATIBILITY_DOCUMENT: ${{ matrix.document }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - name: Download verified corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pinned-corpora
          path: .tmp/compatibility-corpora
      - name: Record runner resources
        shell: bash
        run: |
          mkdir -p .tmp/compatibility-ci
          { free -h; df -h .; } | tee .tmp/compatibility-ci/runner.txt
      - name: Add temporary Graph checker swap
        if: matrix.corpus == 'regression' && matrix.document == 'microsoft-graph-beta'
        shell: bash
        run: |
          compatibility_swap="$RUNNER_TEMP/openapi-sdkgen-compatibility.swap"
          sudo fallocate -l 16G "$compatibility_swap"
          sudo chmod 600 "$compatibility_swap"
          sudo mkswap "$compatibility_swap"
          sudo swapon "$compatibility_swap"
          free -h | tee .tmp/compatibility-ci/checker-memory.txt
      - name: Install TypeScript dependencies
        run: just agent ts-install
      - name: Generate SDKs and run full strict typechecks
        timeout-minutes: 90
        shell: bash
        run: |
          /usr/bin/time -v -o .tmp/compatibility-ci/resources.txt \
            just agent compatibility-benchmark "test/compatibility/$COMPATIBILITY_CORPUS.json" \
            ".tmp/compatibility-corpora/$COMPATIBILITY_CORPUS" \
            .tmp/compatibility-ci/report.json 60m "$COMPATIBILITY_DOCUMENT" &
          compatibility_process=$!
          python3 -B -u .github/scripts/compatibility_observer.py \
            --root-pid "$compatibility_process" --typescript-root test/typescript \
            --output .tmp/compatibility-ci/progress.jsonl &
          compatibility_observer=$!
          trap 'kill "$compatibility_observer" 2>/dev/null || true; wait "$compatibility_observer" 2>/dev/null || true' EXIT
          wait "$compatibility_process"
      - name: Require a verified supported SDK profile
        shell: bash
        run: |
          python3 -B .github/scripts/compatibility_gate.py \
            --manifest "test/compatibility/$COMPATIBILITY_CORPUS.json" \
            --report .tmp/compatibility-ci/report.json --document "$COMPATIBILITY_DOCUMENT"
      - name: Upload measurement and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: document-shard-${{ matrix.corpus }}-${{ matrix.document }}
          path: |
            .tmp/compatibility-ci/
            .tmp/agent-logs/
          include-hidden-files: true
          retention-days: 7

  report:
    name: Combine all corpus results
    needs: [prepare, documents]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - name: Download document measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: document-shard-*
          path: .tmp/compatibility-shards
      - name: Combine and verify every corpus
        shell: bash
        run: |
          compatibility_failed=0
          for corpus in holdout modern production32 regression; do
            if just agent compatibility-merge "test/compatibility/$corpus.json" \
              ".tmp/compatibility-ci/$corpus-results.json" \
              .tmp/compatibility-shards/document-shard-"$corpus"-*/compatibility-ci/report.json; then
              python3 -B .github/scripts/compatibility_gate.py \
                --manifest "test/compatibility/$corpus.json" \
                --report ".tmp/compatibility-ci/$corpus-results.json" || compatibility_failed=1
            else
              compatibility_failed=1
            fi
          done
          exit "$compatibility_failed"
      - name: Upload combined measurement and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-corpus-compatibility
          path: |
            .tmp/compatibility-ci/
            .tmp/agent-logs/
          include-hidden-files: true
          retention-days: 7
